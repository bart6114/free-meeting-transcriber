name: cli-release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build CLI binaries for (defaults to the latest release)
        required: false
        default: ""
  workflow_call:
    inputs:
      tag:
        type: string
        required: true

permissions: {}

concurrency:
  group: cli-release
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ -n "$INPUT_TAG" ]; then
            tag="$(gh release view "$INPUT_TAG" --json tagName --jq .tagName)"
          else
            tag="$(gh release view --json tagName --jq .tagName)"
          fi
          echo "Building $tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  build:
    needs: resolve
    strategy:
      fail-fast: false
      matrix:
        include:
          - triple: aarch64-apple-darwin
            runner: macos-latest
          - triple: x86_64-apple-darwin
            runner: macos-15-intel
          - triple: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
          - triple: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.tag }}
          persist-credentials: false
      - uses: ./.github/actions/rust_install
      - run: cargo build --locked --release -p loofah-cli
      - env:
          TAG: ${{ needs.resolve.outputs.tag }}
          TRIPLE: ${{ matrix.triple }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          test "$(jq -r .version package.json)" = "$version"
          for bin in target/release/loofah target/release/fmtr; do
            if [ "$(uname -s)" = "Darwin" ]; then
              strip -x "$bin"
              codesign -s - -f "$bin"
            else
              strip "$bin"
            fi
            "$bin" --version | grep -F "$version"
          done
          asset="loofah-${version}-${TRIPLE}.tar.gz"
          COPYFILE_DISABLE=1 tar -czf "$asset" -C target/release loofah fmtr
          if command -v sha256sum >/dev/null; then
            sha256sum "$asset" > "$asset.sha256"
          else
            shasum -a 256 "$asset" > "$asset.sha256"
          fi
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve.outputs.tag }}
          TRIPLE: ${{ matrix.triple }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          gh release upload "$TAG" \
            "loofah-${version}-${TRIPLE}.tar.gz" \
            "loofah-${version}-${TRIPLE}.tar.gz.sha256" \
            --clobber
          cp "loofah-${version}-${TRIPLE}.tar.gz" "fmtr-${version}-${TRIPLE}.tar.gz"
          cp "loofah-${version}-${TRIPLE}.tar.gz.sha256" "fmtr-${version}-${TRIPLE}.tar.gz.sha256"
          sed -i.bak "s/loofah-${version}-${TRIPLE}/fmtr-${version}-${TRIPLE}/" \
            "fmtr-${version}-${TRIPLE}.tar.gz.sha256"
          rm -f "fmtr-${version}-${TRIPLE}.tar.gz.sha256.bak"
          gh release upload "$TAG" \
            "fmtr-${version}-${TRIPLE}.tar.gz" \
            "fmtr-${version}-${TRIPLE}.tar.gz.sha256" \
            --clobber

  publish-latest:
    needs: [resolve, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          if ! gh release view updater >/dev/null 2>&1; then
            gh release create updater --prerelease \
              --title "Updater feed" \
              --notes "Rolling release holding latest.json for the in-app updater and stable-named copies of the latest artifacts. Do not delete."
          fi
          feed_version="$(gh release download updater --pattern loofah-latest-version.txt -O - 2>/dev/null || gh release download updater --pattern fmtr-latest-version.txt -O - 2>/dev/null || echo "0.0.0")"
          newest="$(printf '%s\n%s\n' "$feed_version" "$version" | sort -V | tail -n1)"
          if [ "$newest" != "$version" ]; then
            echo "CLI feed already at $feed_version; not downgrading to $version"
            exit 0
          fi
          gh release download "$TAG" --pattern "loofah-${version}-*.tar.gz"
          count="$(ls loofah-"${version}"-*.tar.gz | wc -l)"
          test "$count" -eq 4
          for asset in loofah-"${version}"-*.tar.gz; do
            triple="${asset#loofah-"${version}"-}"
            triple="${triple%.tar.gz}"
            latest="loofah-latest-${triple}.tar.gz"
            mv "$asset" "$latest"
            sha256sum "$latest" > "$latest.sha256"
            cp "$latest" "fmtr-latest-${triple}.tar.gz"
            sha256sum "fmtr-latest-${triple}.tar.gz" > "fmtr-latest-${triple}.tar.gz.sha256"
          done
          printf '%s\n' "$version" > loofah-latest-version.txt
          printf '%s\n' "$version" > fmtr-latest-version.txt
          gh release upload updater loofah-latest-* fmtr-latest-* --clobber

  verify:
    needs: publish-latest
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-latest, ubuntu-22.04, ubuntu-22.04-arm]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - env:
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          case "$(uname -s)/$(uname -m)" in
            Darwin/arm64) triple=aarch64-apple-darwin ;;
            Darwin/x86_64) triple=x86_64-apple-darwin ;;
            Linux/x86_64) triple=x86_64-unknown-linux-gnu ;;
            Linux/aarch64) triple=aarch64-unknown-linux-gnu ;;
            *) echo "unsupported verify host"; exit 1 ;;
          esac
          asset="loofah-latest-${triple}.tar.gz"
          base="https://github.com/$REPO/releases/download/updater"
          curl -fsSL --proto '=https' --tlsv1.2 -O "$base/$asset" -O "$base/$asset.sha256"
          if command -v sha256sum >/dev/null; then
            sha256sum -c "$asset.sha256"
          else
            shasum -a 256 -c "$asset.sha256"
          fi
          tar -xzf "$asset"
          ./loofah --version
          ./fmtr --version
          if [ "$(uname -s)" = "Linux" ]; then
            max="$(objdump -T loofah | grep -oE 'GLIBC_[0-9.]+' | sort -uV | tail -n1)"
            echo "max glibc symbol: $max"
            test "$(printf '%s\n%s\n' "${max#GLIBC_}" 2.35 | sort -V | tail -n1)" = "2.35"
          fi
