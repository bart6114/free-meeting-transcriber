name: claude-issue-plan

on:
  issues:
    types: [opened]

permissions:
  contents: read

jobs:
  plan:
    # Issues that mention @claude are handled by the claude.yaml workflow instead.
    if: ${{ !contains(github.event.issue.body, '@claude') && !contains(github.event.issue.title, '@claude') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          track_progress: true
          show_full_output: true
          prompt: |
            A new issue was opened in ${{ github.repository }}: issue number ${{ github.event.issue.number }}.

            1. Read the issue with `gh issue view ${{ github.event.issue.number }} --comments`.
            2. Explore the codebase to understand which crates, apps, and modules are involved.
            3. Draft a concrete implementation plan:
               - a short restatement of the problem/request
               - proposed approach (with alternatives only if the choice is genuinely unclear)
               - the specific files/modules to change and how
               - step-by-step task breakdown
               - risks, edge cases, and open questions for the author
            4. Replace the body of your tracking comment with the finished plan (use the update_claude_comment tool).

            If the issue is not actionable (support question, spam, missing information), put a short note in the tracking comment saying what information is needed instead of a plan.
          claude_args: |
            --model claude-opus-5
            --allowedTools "Bash(gh issue view:*),Bash(gh issue comment:*),Write,Read,Glob,Grep,mcp__github_comment__update_claude_comment"
