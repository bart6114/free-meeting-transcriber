name: desktop-release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and attach the DMG to (defaults to the latest release)
        required: false
        default: ""

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      build_macos: ${{ steps.tag.outputs.build_macos }}
    steps:
      - name: Resolve release tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ -n "$INPUT_TAG" ]; then
            tag="$(gh release view "$INPUT_TAG" --json tagName --jq .tagName)"
          else
            tag="$(gh release view --json tagName --jq .tagName)"
          fi
          echo "Building $tag"
          version="${tag#v}"
          assets="$(gh release view "$tag" --json assets --jq '.assets[].name')"
          build_macos=false
          for asset in \
            "Loofah_${version}_aarch64.dmg" \
            "Loofah_${version}_aarch64.dmg.sha256" \
            "Loofah_${version}_aarch64.app.tar.gz" \
            "Loofah_${version}_aarch64.app.tar.gz.sig" \
            "FreeMeetingTranscriber_${version}_aarch64.dmg" \
            "FreeMeetingTranscriber_${version}_aarch64.dmg.sha256" \
            "FreeMeetingTranscriber_${version}_aarch64.app.tar.gz" \
            "FreeMeetingTranscriber_${version}_aarch64.app.tar.gz.sig" \
            latest.json; do
            if ! grep -Fxq "$asset" <<< "$assets"; then
              echo "Missing desktop asset: $asset"
              build_macos=true
            fi
          done
          {
            echo "tag=$tag"
            echo "build_macos=$build_macos"
          } >> "$GITHUB_OUTPUT"

  changelog:
    needs: resolve
    permissions:
      contents: write
      # changelog.yaml dispatches docs-deploy after committing a new entry.
      actions: write
    uses: ./.github/workflows/changelog.yaml
    with:
      tag: ${{ needs.resolve.outputs.tag }}
    secrets: inherit

  macos:
    needs: [resolve, changelog]
    if: needs.resolve.outputs.build_macos == 'true'
    runs-on: macos-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.tag }}
          lfs: true
          persist-credentials: false
      - uses: ./.github/actions/pnpm_install
      - uses: denoland/setup-deno@v2
      - run: pnpm -F ui build
      - uses: ./.github/actions/install_desktop_deps
        with:
          target: macos
      - uses: ./.github/actions/rust_install
        with:
          platform: macos
          cache-targets: "true"
          sccache: "true"
      - run: echo "SDKROOT=$(xcrun --sdk macosx --show-sdk-path)" >> $GITHUB_ENV
      - name: Prepare notarization key
        env:
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
        run: |
          printf '%s\n' "$APPLE_API_KEY_CONTENT" > "$RUNNER_TEMP/AuthKey.p8"
          echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
      - name: Build Loofah CLI sidecar
        run: bash apps/desktop/src-tauri/scripts/build-cli-sidecar.sh
      - run: pnpm -F desktop tauri build --ci --bundles app,dmg --config ./src-tauri/tauri.conf.stable.json
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
      - name: Prepare Apple Silicon CLI release asset
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          cli_dir="$RUNNER_TEMP/cli-release"
          bin="target/release/loof"
          asset="loof-${version}-aarch64-apple-darwin.tar.gz"
          mkdir -p "$cli_dir"
          strip -x "$bin"
          codesign -s - -f "$bin"
          "$bin" --version | grep -F "$version"
          COPYFILE_DISABLE=1 tar -czf "$cli_dir/$asset" -C target/release loof
          (cd "$cli_dir" && shasum -a 256 "$asset" > "$asset.sha256")
      - name: Checksum
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          bundle_dir="apps/desktop/src-tauri/target/release/bundle/dmg"
          dmg="$(ls "$bundle_dir"/*.dmg | head -n1)"
          asset="Loofah_${version}_aarch64.dmg"
          mv "$dmg" "$bundle_dir/$asset"
          (cd "$bundle_dir" && shasum -a 256 "$asset" > "$asset.sha256")
          cp "$bundle_dir/$asset" "$bundle_dir/FreeMeetingTranscriber_${version}_aarch64.dmg"
          (cd "$bundle_dir" && shasum -a 256 "FreeMeetingTranscriber_${version}_aarch64.dmg" > "FreeMeetingTranscriber_${version}_aarch64.dmg.sha256")
      - name: Prepare updater artifacts
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          macos_dir="apps/desktop/src-tauri/target/release/bundle/macos"
          archive="$(ls "$macos_dir"/*.app.tar.gz | head -n1)"
          asset="Loofah_${version}_aarch64.app.tar.gz"
          mv "$archive" "$macos_dir/$asset"
          mv "$archive.sig" "$macos_dir/$asset.sig"
          cp "$macos_dir/$asset" "$macos_dir/FreeMeetingTranscriber_${version}_aarch64.app.tar.gz"
          cp "$macos_dir/$asset.sig" "$macos_dir/FreeMeetingTranscriber_${version}_aarch64.app.tar.gz.sig"
          jq -n \
            --arg version "$version" \
            --arg pub_date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg signature "$(cat "$macos_dir/$asset.sig")" \
            --arg url "https://github.com/$REPO/releases/download/$TAG/$asset" \
            '{version: $version, pub_date: $pub_date, platforms: {"darwin-aarch64": {signature: $signature, url: $url}}}' \
            > "$macos_dir/latest.json"
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          bundle_dir="apps/desktop/src-tauri/target/release/bundle/dmg"
          macos_dir="apps/desktop/src-tauri/target/release/bundle/macos"
          cli_dir="$RUNNER_TEMP/cli-release"
          gh release upload "$TAG" \
            "$bundle_dir"/*.dmg "$bundle_dir"/*.sha256 \
            "$macos_dir"/*.app.tar.gz "$macos_dir"/*.app.tar.gz.sig "$macos_dir/latest.json" \
            "$cli_dir"/*.tar.gz "$cli_dir"/*.sha256 \
            --clobber
  publish-desktop-updater:
    needs: [resolve, changelog, macos]
    if: >-
      ${{
        always() &&
        needs.resolve.result == 'success' &&
        needs.changelog.result == 'success' &&
        (needs.macos.result == 'success' || needs.macos.result == 'skipped')
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish updater feed
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve.outputs.tag }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          if ! gh release view updater >/dev/null 2>&1; then
            gh release create updater --prerelease \
              --title "Updater feed" \
              --notes "Rolling release holding latest.json for the in-app updater and a stable-named copy of the latest DMG. Do not delete."
          fi
          feed_version="$(gh release download updater --pattern latest.json -O - 2>/dev/null | jq -r .version || echo "0.0.0")"
          newest="$(printf '%s\n%s\n' "$feed_version" "$version" | sort -V | tail -n1)"
          if [ "$newest" != "$version" ]; then
            echo "Feed already at $feed_version; not downgrading to $version"
            exit 0
          fi
          release_dir="$RUNNER_TEMP/release"
          mkdir -p "$release_dir"
          gh release download "$TAG" --pattern latest.json --dir "$release_dir"
          gh release download "$TAG" --pattern "Loofah_${version}_aarch64.dmg" --dir "$release_dir"
          cp "$release_dir/Loofah_${version}_aarch64.dmg" "$release_dir/Loofah_latest_aarch64.dmg"
          cp "$release_dir/Loofah_${version}_aarch64.dmg" "$release_dir/FreeMeetingTranscriber_latest_aarch64.dmg"
          gh release upload updater \
            "$release_dir/latest.json" \
            "$release_dir/Loofah_latest_aarch64.dmg" \
            "$release_dir/FreeMeetingTranscriber_latest_aarch64.dmg" \
            --clobber

  cli:
    needs: [resolve, changelog, macos]
    if: >-
      ${{
        always() &&
        needs.resolve.result == 'success' &&
        needs.changelog.result == 'success' &&
        (needs.macos.result == 'success' || needs.macos.result == 'skipped')
      }}
    permissions:
      contents: write
    uses: ./.github/workflows/cli_release.yaml
    with:
      tag: ${{ needs.resolve.outputs.tag }}
