name: release

on:
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # ref: main (not the pushed sha) + kept credentials: this job
          # commits the bump on top of the latest main and pushes it back.
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - name: Bump version, tag, and create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # A human push can land on main mid-run; --atomic keeps the branch
          # and tag together, and each retry recomputes from the fresh tip.
          for attempt in 1 2 3; do
            git fetch --tags origin main
            git reset --hard origin/main

            last_tag="$(git describe --tags --match 'v*' --abbrev=0 2>/dev/null || true)"
            if [ -n "$last_tag" ]; then
              range="${last_tag}..HEAD"
            else
              range=HEAD
            fi

            log="$(git log --format='%s%n%b' "$range")"
            bump=patch
            if printf '%s\n' "$log" | grep -qE '(^[a-z]+(\([^)]*\))?!:)|(^BREAKING CHANGE:)'; then
              bump=major
            elif printf '%s\n' "$log" | grep -qE '^feat(\([^)]*\))?:'; then
              bump=minor
            fi

            version="$(npm version "$bump" --no-git-tag-version)"
            (cd apps/desktop && npm version "${version#v}" --no-git-tag-version --allow-same-version)

            git commit -am "chore(release): ${version} [skip ci]"
            git tag -f "$version"
            if git push --atomic origin main "$version"; then
              gh release create "$version" --generate-notes
              exit 0
            fi
            echo "push rejected (attempt $attempt), retrying from fresh main"
            git tag -d "$version"
          done
          echo "gave up after 3 attempts"
          exit 1
